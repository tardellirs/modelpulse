name: Health check

# Fails (and GitHub emails you) when the API is down or any of the model, dataset or Space data is more than 3 days old.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: API answers and data is fresh
        # the route from GitHub's runners to the server sometimes drops for a few minutes while the site keeps serving
        # everyone else, so a connection that can't be made is retried for ~12 minutes; any HTTP answer is final
        run: |
          for i in 1 2 3 4 5; do
            body=$(curl -sS --retry 2 --retry-delay 15 --connect-timeout 20 --max-time 30 -w '\n%{http_code}' https://modelpulse.ifsp.dev/api/health || true)
            code=$(echo "$body" | tail -1); json=$(echo "$body" | head -1)
            [ "$code" != "000" ] && [ -n "$code" ] && break
            echo "no connection (attempt $i), retrying in 3 min"; sleep 180
          done
          echo "HTTP $code: $json"
          [ "$code" = "200" ] || { echo "::error::Model Pulse API unhealthy (HTTP $code): $json"; exit 1; }
      - name: Dataset and Space pages answer
        run: |
          for u in /api/dataset/HuggingFaceFW/fineweb /api/space/enzostvs/deepsite /dataset/HuggingFaceFW/fineweb; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 2 --max-time 30 "https://modelpulse.ifsp.dev$u")
            echo "$u HTTP $code"; [ "$code" = "200" ] || { echo "::error::$u returned $code"; exit 1; }
          done
      - name: Badge renders
        run: |
          curl -sSf --max-time 30 https://modelpulse.ifsp.dev/badge/Qwen/Qwen3-8B.svg | grep -q '<svg' || { echo "::error::Badge endpoint broken"; exit 1; }
      - name: Site is up
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 https://tardellirs-model-pulse.static.hf.space/)
          echo "site HTTP $code"; [ "$code" = "200" ] || { echo "::error::Static Space returned $code"; exit 1; }
