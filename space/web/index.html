<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Model Pulse · Download history for every Hugging Face model</title>
    <meta name="description" content="Daily downloads, likes and family growth for 1M+ models on the Hugging Face Hub, since July 2024." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='8' fill='%23FFD21E' stroke='%231B1B1F' stroke-width='3'/%3E%3Cpath d='M5 17h5l3-8 5 15 3-7h6' fill='none' stroke='%231B1B1F' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <!-- the server sends a plain-HTML version of each page for search engines; with JavaScript the app replaces it -->
    <script>document.documentElement.classList.add("js")</script>
    <style>.js #app > .ssr { display: none }</style>
    <!-- Google Analytics (GA4), one stream for modelpulse.ifsp.dev and the Hugging Face Space. Page changes inside the
         app are history pushes, which GA4's enhanced measurement already counts. The library loads once the page is
         idle so it never competes with the first render; inside the Space's iframe the cookies must allow third-party use. -->
    <script>
      if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag("js", new Date());
        gtag("config", "G-DZCN93407Y", window.top !== window ? { cookie_flags: "SameSite=None;Secure" } : {});
        addEventListener("load", function () {
          (window.requestIdleCallback || setTimeout)(function () {
            var s = document.createElement("script");
            s.async = true; s.src = "https://www.googletagmanager.com/gtag/js?id=G-DZCN93407Y";
            document.head.appendChild(s);
          }, { timeout: 2000 });
        });
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
